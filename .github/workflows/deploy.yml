
name: Publicar sitio Ruta Local

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener archivos
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Publicar sitio
        uses: actions/deploy-pages@v4
